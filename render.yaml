# render.yaml — VCUBE Academy Render Blueprint

databases:
  - name: vcube-db
    plan: free
    databaseName: vcube_academy
    user: vcube_user

services:

  # Backend
  - type: web
    name: vcube-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free

    healthCheckPath: /api/actuator/health

    envVars:

      # PostgreSQL
      - key: DATABASE_HOST
        fromDatabase:
          name: vcube-db
          property: host

      - key: DATABASE_PORT
        fromDatabase:
          name: vcube-db
          property: port

      - key: DATABASE_NAME
        fromDatabase:
          name: vcube-db
          property: database

      - key: DATABASE_USERNAME
        fromDatabase:
          name: vcube-db
          property: user

      - key: DATABASE_PASSWORD
        fromDatabase:
          name: vcube-db
          property: password

      # JWT
      - key: JWT_SECRET
        generateValue: true

      # CORS
      - key: CORS_ALLOWED_ORIGINS
        value: https://vcube-frontend.onrender.com

      # AI
      - key: AI_PROVIDER
        value: BUILTIN

      - key: AI_API_KEY
        value: ""

  # Frontend
  - type: web
    name: vcube-frontend
    runtime: static

    rootDir: frontend

    buildCommand: npm install && npm run build

    staticPublishPath: ./dist

    envVars:
      - key: VITE_API_BASE_URL
        value: https://vcube-backend.onrender.com/api

    routes:
      - type: rewrite
        source: /*
        destination: /index.html