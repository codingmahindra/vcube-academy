# render.yaml — VCUBE Academy Render Blueprint

databases:
  - name: vcube-db
    plan: free
    databaseName: vcube_academy
    user: vcube_user

services:

  # =========================================================
  # BACKEND - Spring Boot
  # =========================================================
  - type: web
    name: vcube-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free

    healthCheckPath: /api/actuator/health

    envVars:

      # PostgreSQL host
      - key: DATABASE_HOST
        fromDatabase:
          name: vcube-db
          property: host

      # PostgreSQL port
      - key: DATABASE_PORT
        fromDatabase:
          name: vcube-db
          property: port

      # PostgreSQL database name
      - key: DATABASE_NAME
        fromDatabase:
          name: vcube-db
          property: database

      # PostgreSQL username
      - key: DATABASE_USERNAME
        fromDatabase:
          name: vcube-db
          property: user

      # PostgreSQL password
      - key: DATABASE_PASSWORD
        fromDatabase:
          name: vcube-db
          property: password

      # JWT secret
      - key: JWT_SECRET
        generateValue: true

      # CORS
      - key: CORS_ALLOWED_ORIGINS
        value: https://vcube-frontend.onrender.com

      # AI configuration
      - key: AI_PROVIDER
        value: BUILTIN

      - key: AI_API_KEY
        value: ""

  # =========================================================
  # FRONTEND - React
  # =========================================================
  - type: web
    name: vcube-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist

    envVars:

      - key: VITE_API_BASE_URL
        value: https://vcube-backend.onrender.com/api

    routes:

      - type: rewrite
        source: /*
        destination: /index.html