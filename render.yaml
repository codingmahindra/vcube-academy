# render.yaml — VCUBE Academy Render Blueprint
# Docs: https://render.com/docs/blueprint-spec
#
# Creates 3 services automatically:
#   1. vcube-db       — Managed PostgreSQL database
#   2. vcube-backend  — Spring Boot API (Docker)
#   3. vcube-frontend — React SPA (Static Site)

databases:
  - name: vcube-db
    plan: free
    databaseName: vcube_academy
    user: vcube_user

services:
  # ── Backend: Spring Boot API ──────────────────────────────────────────────
  - type: web
    name: vcube-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /api/actuator/health
    envVars:
      # Database — auto-wired from managed Render PostgreSQL
      - key: DATABASE_URL
        fromDatabase:
          name: vcube-db
          property: connectionString
      - key: DATABASE_USERNAME
        fromDatabase:
          name: vcube-db
          property: user
      - key: DATABASE_PASSWORD
        fromDatabase:
          name: vcube-db
          property: password
      # Security — Render auto-generates a cryptographically secure value
      - key: JWT_SECRET
        generateValue: true
      # CORS — must match the exact frontend URL Render assigns
      - key: CORS_ALLOWED_ORIGINS
        value: https://vcube-frontend.onrender.com
      # AI — built-in engine (no external API key required)
      - key: AI_PROVIDER
        value: BUILTIN
      - key: AI_API_KEY
        value: ""

  # ── Frontend: React SPA ───────────────────────────────────────────────────
  - type: static
    name: vcube-frontend
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      # Must point to the Render backend service URL
      - key: VITE_API_BASE_URL
        value: https://vcube-backend.onrender.com/api
    routes:
      # SPA fallback — all routes serve index.html
      - type: rewrite
        source: /*
        destination: /index.html
